<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Referral Bridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F5F8; --surface:#FFFFFF; --ink:#18202E; --muted:#5E6878; --rule:#DCE0E6;
  --biz:#0B7A64; --biz-soft:#E2F3EE; --coi:#5A3EA6; --coi-soft:#EEE9FA;
  --warn:#9A5B00; --danger:#B42318; --danger-soft:#FDECEA;
  --nav-h:64px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#11151C; --surface:#1A2029; --ink:#E7EAEF; --muted:#9AA3B2; --rule:#2B3240;
    --biz:#43C3A5; --biz-soft:#153A32; --coi:#AE98F2; --coi-soft:#2A2344;
    --warn:#E0A54A; --danger:#F07A6E; --danger-soft:#3A1D1B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11151C; --surface:#1A2029; --ink:#E7EAEF; --muted:#9AA3B2; --rule:#2B3240;
  --biz:#43C3A5; --biz-soft:#153A32; --coi:#AE98F2; --coi-soft:#2A2344;
  --warn:#E0A54A; --danger:#F07A6E; --danger-soft:#3A1D1B; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:calc(var(--nav-h) + 16px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--coi);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding:14px 18px 10px;border-bottom:1px solid var(--rule);display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-weight:700;font-size:1.15rem;letter-spacing:-0.01em;display:flex;align-items:center;gap:8px}
.brand svg{flex:none}
.sync{font-size:.8rem;color:var(--muted);text-align:right}
.tagline{font-size:.78rem;color:var(--muted);margin-top:1px}
main{max-width:720px;margin:0 auto;padding:16px}
h2{font-size:1.35rem;margin:6px 0 4px;letter-spacing:-0.01em}
.lede{color:var(--muted);margin:0 0 14px;font-size:.95rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--rule);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:.92rem}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.biz{background:var(--biz);border-color:var(--biz);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding-left:6px;padding-right:6px}
.btn.danger{color:var(--danger);background:transparent;border-color:transparent}
:root:not([data-theme="light"]) .btn.biz{color:#0B1A16}
.search{flex:1;min-width:160px;border:1px solid var(--rule);background:var(--surface);border-radius:10px;padding:9px 12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:12px;overflow:hidden;margin:4px 0 16px}
.stat{background:var(--surface);padding:12px}
.stat b{display:block;font-size:1.4rem;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.88rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip small{opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}
.list{display:grid;gap:10px}
.empty{border:1px dashed var(--rule);border-radius:12px;padding:22px;text-align:center;color:var(--muted)}
.empty p{margin:0 0 12px}

/* The bridge: business on the left, advisor on the right, score as the span between */
.bridge{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;background:var(--surface);border:1px solid var(--rule);border-radius:14px;overflow:hidden;text-align:left;width:100%;padding:0}
.side{padding:12px 12px;min-width:0}
.side.b{border-left:4px solid var(--biz)}
.side.c{border-right:4px solid var(--coi);text-align:right}
.side .name{font-weight:650;font-size:.95rem;line-height:1.3;overflow-wrap:anywhere}
.side .meta{font-size:.78rem;color:var(--muted);margin-top:2px}
.span{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 2px;position:relative;min-width:64px}
.span::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dashed var(--rule)}
.dial{--v:50;position:relative;width:48px;height:48px;border-radius:50%;background:conic-gradient(var(--ink) calc(var(--v)*1%),var(--rule) 0);display:grid;place-items:center}
.dial::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--surface)}
.dial b{position:relative;z-index:1;font-size:.95rem;font-variant-numeric:tabular-nums}
.span small{position:relative;z-index:1;background:var(--surface);font-size:.7rem;color:var(--muted);margin-top:4px;padding:0 4px;white-space:nowrap}
.why{font-size:.8rem;color:var(--muted);padding:8px 12px;border-top:1px solid var(--rule);grid-column:1/-1}
.actions{grid-column:1/-1;display:flex;gap:8px;padding:0 12px 12px;justify-content:flex-end}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;text-align:left;width:100%}
.card.b{border-left:4px solid var(--biz)}
.card.c{border-left:4px solid var(--coi)}
.card .name{font-weight:650}
.card .meta{font-size:.82rem;color:var(--muted)}
.tag{display:inline-block;font-size:.72rem;font-weight:600;border-radius:6px;padding:1px 7px;margin:4px 4px 0 0}
.tag.b{background:var(--biz-soft);color:var(--biz)}
.tag.c{background:var(--coi-soft);color:var(--coi)}
.tag.s{background:var(--rule);color:var(--muted)}
.learn{margin-top:22px}
.learn h3{font-size:1rem;margin:0 0 8px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 12px;border-bottom:1px solid var(--rule);text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:0}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{background:none;border:0;padding:10px 2px 12px;font-size:.72rem;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] i{background:var(--ink)}
.tabs i{display:block;width:22px;height:4px;border-radius:2px;background:transparent}
dialog{border:0;padding:0;border-radius:18px 18px 0 0;width:100%;max-width:600px;margin:auto auto 0;max-height:90vh;background:var(--surface);color:var(--ink)}
@media (min-width:640px){dialog{border-radius:18px;margin:auto}}
dialog::backdrop{background:rgba(10,14,20,.45)}
.sheet{padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 12px;font-size:1.15rem}
.field{display:grid;gap:4px;margin-bottom:12px}
.field label{font-size:.85rem;font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:9px 11px;width:100%}
.field textarea{min-height:80px;resize:vertical}
.check{display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:.92rem}
.err{color:var(--danger);font-size:.82rem;min-height:1em}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.seg button{border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:6px 10px;font-size:.85rem;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.pair .card{padding:10px}
.reasons{margin:0 0 14px;padding-left:18px;color:var(--muted);font-size:.88rem}
.sheet-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:10px;font-size:.88rem;z-index:20;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.filters{display:grid;gap:10px;margin-bottom:14px}
.filters .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters select{border:1px solid var(--rule);background:var(--surface);border-radius:10px;padding:9px 10px;width:100%}
.filters label.small{font-size:.8rem;color:var(--muted);display:block;margin-bottom:3px}
.bigsearch{width:100%;border:2px solid var(--ink);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:1rem}
.result{background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--coi);border-radius:12px;padding:12px 14px}
.result .top-line{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.result .name{font-weight:650}
.result .meta{font-size:.82rem;color:var(--muted)}
.fit{flex:none;font-weight:700;font-variant-numeric:tabular-nums;font-size:.9rem;border:1px solid var(--rule);border-radius:8px;padding:2px 8px}
.result .why{border:0;padding:6px 0 0;font-size:.82rem;color:var(--muted)}
.result .row{margin-top:10px}
a.btn{text-decoration:none;display:inline-block}
.count{font-size:.85rem;color:var(--muted);margin:0 0 8px}
.quizcta{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--coi-soft);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.quizcta p{margin:0;font-size:.9rem}
.qprog{height:4px;background:var(--rule);border-radius:2px;margin:4px 0 14px;overflow:hidden}
.qprog i{display:block;height:100%;background:var(--coi)}
.qstep{font-size:.8rem;color:var(--muted)}
.qopts{display:grid;gap:8px;margin-bottom:14px}
.qopt{text-align:left;border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:11px 14px;font-weight:600}
.qopt[aria-pressed="true"]{border-color:var(--coi);background:var(--coi-soft);color:var(--coi)}
.qopts.grid2{grid-template-columns:1fr 1fr}
.compat{border:1px solid var(--rule);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--surface)}
.compat .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pct{text-align:right;flex:none}
.pct b{font-size:1.6rem;line-height:1;font-variant-numeric:tabular-nums;color:var(--coi)}
.pct span{display:block;font-size:.72rem;color:var(--muted)}
.dims{display:grid;grid-template-columns:auto 1fr auto;gap:5px 10px;align-items:center;margin:10px 0 6px;font-size:.8rem}
.dims .bar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.dims .bar i{display:block;height:100%;background:var(--coi)}
.dims .v{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.pick{display:flex;gap:8px;align-items:center;font-size:.88rem;font-weight:600;margin-top:6px}
.srcs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.srcs a{display:block;text-decoration:none;border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:9px 11px;font-size:.86rem;font-weight:600;color:var(--ink)}
.srcs a small{display:block;font-weight:400;color:var(--muted);font-size:.74rem}
.sec{font-size:.95rem;margin:16px 0 8px}
.meter{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);margin-top:6px}
.meter .bar{flex:1;height:6px;background:var(--rule);border-radius:3px;overflow:hidden;max-width:160px}
.meter .bar i{display:block;height:100%;background:var(--biz)}
.stars{display:inline-block;font-size:.72rem;font-weight:600;border-radius:6px;padding:1px 7px;margin:4px 4px 0 0;background:#FFF4D6;color:#7A5200}
:root[data-theme="dark"] .stars{background:#3A2E10;color:#F2C45A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stars{background:#3A2E10;color:#F2C45A}}
.grid2f{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.bio{font-size:.9rem;margin:6px 0 0;color:var(--ink)}
.hint{font-size:.82rem;color:var(--muted);margin:10px 0 0}
.hint a{color:var(--coi)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
:root{--v-bg:#E3F1E8;--v-fg:#1B5E3A;--p-bg:#E4ECF8;--p-fg:#1F4E8C;--a-bg:#FBEBDD;--a-fg:#7A3A0C;--u-bg:#E9EBEE;--u-fg:#434C59}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--v-bg:#173A28;--v-fg:#8FDDB0;--p-bg:#1B2A44;--p-fg:#A9C8F5;--a-bg:#3A2412;--a-fg:#F2B27A;--u-bg:#2B3240;--u-fg:#C3CAD5}}
:root[data-theme="dark"]{--v-bg:#173A28;--v-fg:#8FDDB0;--p-bg:#1B2A44;--p-fg:#A9C8F5;--a-bg:#3A2412;--a-fg:#F2B27A;--u-bg:#2B3240;--u-fg:#C3CAD5}
.prov{display:inline-block;font-size:.64rem;font-weight:700;letter-spacing:.03em;border-radius:5px;padding:1px 6px;vertical-align:1px}
.prov.v{background:var(--v-bg);color:var(--v-fg)}.prov.p{background:var(--p-bg);color:var(--p-fg)}.prov.a{background:var(--a-bg);color:var(--a-fg)}.prov.u{background:var(--u-bg);color:var(--u-fg)}
.prov.t{border:1px dashed var(--muted);color:var(--muted);background:transparent}
.opp{flex:none;min-width:58px;text-align:center;border-radius:10px;padding:5px 8px;background:var(--ink);color:var(--paper)}
.opp b{display:block;font-size:1.25rem;line-height:1.1;font-variant-numeric:tabular-nums}.opp span{font-size:.58rem;font-weight:700;letter-spacing:.05em}
.opp.lo{background:var(--rule);color:var(--ink)}
.oc-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.oppcard{background:var(--ink);color:var(--paper);border-radius:14px;padding:14px 16px;margin:14px 0 10px}
.oppbtn{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;background:none;border:0;color:inherit;text-align:left;padding:0}
.oppbtn .k,.next .k{display:block;font-size:.72rem;font-weight:700;letter-spacing:.05em;opacity:.8}.oppbtn .s{display:block;font-size:.85rem;opacity:.8}.oppbtn .t{display:block;font-size:.85rem;font-weight:700;margin-top:2px;text-decoration:underline}
.oppbtn .big{font-size:2.8rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.bd{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--muted);font-size:.9rem}
.bd .pts{font-weight:800;font-variant-numeric:tabular-nums}.bd small{display:block;opacity:.75;font-size:.78rem}
.next{background:var(--coi-soft);border-radius:12px;padding:12px 14px;margin:10px 0;font-size:.92rem}
.sig{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule)}.sig:last-child{border-bottom:0}
.sig .d{font-size:.78rem;color:var(--muted);font-weight:600}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.tile b{font-size:1.4rem;line-height:1.2;font-variant-numeric:tabular-nums}.tile span{font-size:.8rem;color:var(--muted)}
.srow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule);align-items:flex-start}.srow:last-child{border-bottom:0}
.switch[aria-pressed="true"]{background:var(--biz);border-color:var(--biz);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .switch[aria-pressed="true"]{color:#0B1A16}}
.oc{display:block}
code{font-size:.78rem;overflow-wrap:anywhere}
.draft{border:1px solid var(--rule);border-radius:12px;padding:10px 12px;margin:0 0 10px;background:var(--paper)}.dk{font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--coi)}.ds{font-weight:650;margin-top:4px}
.dbody{white-space:pre-wrap;font-size:.88rem;line-height:1.45;margin:6px 0 8px;max-height:220px;overflow:auto}.plan{margin:6px 0 0;padding-left:20px;font-size:.88rem}.plan li{margin:2px 0}
.brainhead h2{margin-bottom:2px}.bsearch{position:relative;display:flex;align-items:center;background:var(--surface);border:1.5px solid var(--rule);border-radius:14px;padding:0 6px 0 14px;margin:10px 0 12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.bsearch:focus-within{border-color:var(--coi)}.bsearch>span{color:var(--muted);font-size:1.15rem;margin-right:6px}.bsearch input{flex:1;min-width:0;border:0;background:none;padding:13px 4px;font-size:1rem;color:var(--ink);outline:none}
.bsearch input::-webkit-search-cancel-button{display:none}.bsearch input:placeholder-shown~.bclear{display:none}.bclear{flex:none;border:0;background:var(--rule);color:var(--ink);width:26px;height:26px;border-radius:50%;font-size:1rem;line-height:1}
.pills.ex{margin-bottom:6px}.pills.ex .pill{color:var(--ink);font-weight:500}
.botlist{padding:0;overflow:hidden}.bgroup{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 14px 4px}.bgroup .meta{text-transform:none;letter-spacing:0;font-weight:500}
.botc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-top:1px solid var(--rule);background:none;padding:12px 14px;color:var(--ink)}.bgroup+.botc{border-top:0}
.bav{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:800;background:var(--coi-soft);color:var(--coi)}.bav.live{background:var(--biz-soft);color:var(--biz)}
.bmid{flex:1;min-width:0;display:flex;flex-direction:column}.bname{font-weight:700;font-size:.95rem;display:flex;align-items:center;gap:6px}.bline{font-size:.85rem;margin-top:1px}.bwhen{font-size:.75rem;color:var(--muted);margin-top:1px}
.bdot{width:8px;height:8px;border-radius:50%;display:inline-block}.bdot.on{background:var(--biz);box-shadow:0 0 0 0 var(--biz);animation:pulse 2s infinite}.bdot.sched{background:var(--coi)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(11,122,100,.5)}70%{box-shadow:0 0 0 6px rgba(11,122,100,0)}100%{box-shadow:0 0 0 0 rgba(11,122,100,0)}}
@media (prefers-reduced-motion:reduce){.bdot.on{animation:none}}
.chev{color:var(--muted);flex:none}.rlist{padding:0;overflow:hidden}.rrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-top:1px solid var(--rule);background:none;padding:11px 14px;color:var(--ink);text-decoration:none}.rrow:first-child{border-top:0}

/* ---- Bridge depth: two pillars, an arch between them, a deck rail underneath ---- */
:root{--lift:0 1px 0 rgba(24,32,46,.04),0 10px 24px -14px rgba(24,32,46,.35);--lift-hi:0 2px 0 rgba(24,32,46,.05),0 18px 32px -16px rgba(24,32,46,.45);--stage-live:var(--coi);--stage-won:var(--biz)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--lift:0 1px 0 rgba(0,0,0,.4),0 12px 26px -14px rgba(0,0,0,.8);--lift-hi:0 2px 0 rgba(0,0,0,.45),0 20px 34px -14px rgba(0,0,0,.9)}}
:root[data-theme="dark"]{--lift:0 1px 0 rgba(0,0,0,.4),0 12px 26px -14px rgba(0,0,0,.8);--lift-hi:0 2px 0 rgba(0,0,0,.45),0 20px 34px -14px rgba(0,0,0,.9)}
.bridge{box-shadow:var(--lift);transition:transform .18s ease,box-shadow .18s ease;position:relative}
button.bridge:hover{transform:translateY(-2px);box-shadow:var(--lift-hi)}
button.bridge:active{transform:translateY(0)}
.bridge .side{position:relative;z-index:1}
.bridge .side.b{background:linear-gradient(90deg,var(--biz-soft),transparent 85%)}
.bridge .side.c{background:linear-gradient(270deg,var(--coi-soft),transparent 85%)}
.bridge .side .lbl{display:block;font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.bridge .side.b .lbl{color:var(--biz)}.bridge .side.c .lbl{color:var(--coi)}
.bridge .span::before{display:none}
.bridge .span{min-width:88px;padding:6px 2px 8px}
.arch{position:absolute;left:-6px;right:-6px;top:6px;height:44px;width:calc(100% + 12px);overflow:visible;pointer-events:none}
.arch path{fill:none;stroke-linecap:round}
.arch .a1{stroke:url(#rbArch);stroke-width:2.5}
.arch .a2{stroke:var(--rule);stroke-width:1;stroke-dasharray:2 4}
.bridge .dial{margin-top:14px;box-shadow:0 0 0 4px var(--surface),var(--lift)}
.bridge .need{grid-column:1/-1;display:flex;gap:8px;align-items:center;justify-content:center;font-size:.78rem;color:var(--muted);padding:0 12px 8px;margin-top:-4px}
.bridge .need b{color:var(--ink);font-weight:600}
.deck{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:0 12px 10px}
.deck i{height:4px;border-radius:2px;background:var(--rule)}
.deck i.on{background:var(--stage-live)}
.deck.won i.on{background:var(--stage-won)}
.deck.lost i{background:var(--danger-soft)}
.decklbl{grid-column:1/-1;display:flex;justify-content:space-between;font-size:.66rem;color:var(--muted);padding:0 12px 10px;margin-top:-6px;letter-spacing:.02em}
/* view switch */
.vswitch{display:inline-grid;grid-template-columns:1fr 1fr;background:var(--rule);border-radius:10px;padding:3px;gap:3px;margin-bottom:12px}
.vswitch button{border:0;background:transparent;border-radius:8px;padding:6px 14px;font-size:.85rem;font-weight:600;color:var(--muted)}
.vswitch button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--lift)}
/* network */
.net{background:var(--surface);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--lift);padding:10px 4px 6px;overflow-x:auto}
.net svg{display:block;width:100%;min-width:340px;height:auto}
.net text{font-family:Figtree,system-ui,sans-serif;fill:var(--ink)}
.net .colh{font-size:9px;font-weight:700;letter-spacing:.1em;fill:var(--muted)}
.net .nd{cursor:pointer;outline:none}

  const sc=Math.round(Object.keys(W).reduce((a,k)=>a+W[k]*V[k],0)/100);

function suggestions(){
  const taken=new Set(S.match.map(m=>m.bizId+":"+m.coiId)), out=[];

const DEFAULT_QUOTA=200, RUNNING=new Set();
function settings(){return byId("settings","providers")||{id:"providers",enabled:{},quotaDefault:DEFAULT_QUOTA}}
function isOn(p){const s=settings();return s.enabled&&p.id in s.enabled?!!s.enabled[p.id]:!!MOCK[p.id]||p.id==="csv-import"}
function usageOf(pid){return byId("usage",pid)||{id:pid,calls:0,cacheHits:0,estCost:0,day:"",dayCalls:0,lastRun:{},lastRunAt:""}}
async function runProvider(pid){
  const p=PROV_BY[pid], m=MOCK[pid];
  if(!p||!m)return;
  if(RUNNING.has(pid)){toast("Already running");return}
  if(!isOn(p)){toast("Turn this source on first");return}
  if(!S.biz.length){toast("Add or import businesses first");return}
  const u={...usageOf(pid)};u.lastRun={...(u.lastRun||{})};
  const day=todayISO();if(u.day!==day){u.day=day;u.dayCalls=0}
  const quota=+(settings().quotaDefault||DEFAULT_QUOTA), ttl=24*36e5, now=Date.now();
  RUNNING.add(pid);render();
  let calls=0,hits=0,found=0,capped=false;
  try{
    for(const b of S.biz){
      if(m.filter&&!m.filter(b))continue;
      const last=Date.parse(u.lastRun[b.id]||"");
      if(!isNaN(last)&&now-last<ttl){hits++;continue}        /* cache: fresh data already on file */
      if(u.dayCalls>=quota){capped=true;break}                 /* quota */
      u.dayCalls++;calls++;u.lastRun[b.id]=new Date().toISOString();
      const sig=mockSignal(p,m,b);
      if(sig&&!byId("signal",sig.id)){await put("signal",sig);found++}  /* duplicate prevention: stable signal ids */
    }
    u.calls=(u.calls||0)+calls;u.cacheHits=(u.cacheHits||0)+hits;u.lastRunAt=new Date().toISOString();
    await put("usage",u);
  }finally{RUNNING.delete(pid)}
  render();
  toast(`${p.name}: ${calls} checked, ${hits} skipped (fresh), ${found} new signal${found===1?"":"s"}${capped?". Daily limit reached":""}`);
}

/* ---------- Learning loop: signal weights adjust from real outcomes ---------- */
const MIN_LEARN=5;  /* closed or rejected referrals per signal type before it can move */
function sigTypesOfMatch(m){const b=byId("biz",m.bizId);return m.sigTypes||(b?[...new Set(signalsFor(b).map(s=>s.type))]:[])}
function learnedWeights(){
  const M=memo();if(M.learn)return M.learn;
  const dec=S.match.filter(m=>["Closed","Rejected"].includes(m.status)); /* only final outcomes teach; Introduced and Meeting are still open */
  const won=dec.filter(m=>m.status==="Closed").length, base=dec.length?won/dec.length:0, agg={}, w={};
  for(const m of dec)for(const t of sigTypesOfMatch(m)){const a=agg[t]=agg[t]||{n:0,won:0};a.n++;if(m.status==="Closed")a.won++}
  const on=!settings().learnOff&&dec.length>=MIN_LEARN*2;
  for(const [t,a] of Object.entries(agg)){
    if(a.n<MIN_LEARN)continue;
    const rate=a.won/a.n, lift=(rate-base)/Math.max(base,.1), shrink=a.n/(a.n+10);
    w[t]={mult:+Math.max(.5,Math.min(1.5,1+.5*lift*shrink)).toFixed(2),n:a.n,won:a.won,rate};
  }
  return M.learn={w:on?w:{},all:w,agg,base,dec:dec.length,on,off:!!settings().learnOff};
}
function learnPanel(){
  const L=learnedWeights(), rows=Object.entries(L.all).sort((a,b)=>b[1].mult-a[1].mult);
  const need=Math.max(0,MIN_LEARN*2-L.dec);
  return`<section class="learn"><h3>How scores are learning</h3>
  <p class="lede">${L.off?"Learning is off. Signal weights use the defaults.":need?`Learning starts after ${need} more finished referral${need===1?"":"s"} (Closed or Rejected). Until then, signal weights use the defaults.`:`Signal types whose referrals closed more often than your average close rate (${Math.round(L.base*100)}%) now count more; ones that didn't count less. Each needs at least ${MIN_LEARN} closed or rejected referrals, and changes are capped between ×0.5 and ×1.5.`}</p>
  ${rows.length?`<div class="tbl-wrap"><table><thead><tr><th>Signal</th><th>Finished</th><th>Closed</th><th>Weight</th></tr></thead><tbody>${rows.map(([t,v])=>`<tr><td>${esc((SIGNAL_TYPES[t]||SIGNAL_TYPES.other).l)}</td><td class="n">${v.n}</td><td class="n">${v.won}</td><td class="n">×${v.mult.toFixed(2)}</td></tr>`).join("")}</tbody></table></div>`:""}
  <div class="row" style="margin-top:8px"><button class="btn" data-learn="1">${L.off?"Turn learning on":"Turn learning off"}</button></div></section>`;
}

/* ---------- Revenue range: one setting, applied across the app ---------- */
function parseMoney(v){
  if(v===null||v===undefined)return null;if(typeof v==="number")return isFinite(v)?v:null;
  const m=String(v).trim().toLowerCase().replace(/[$,\s]/g,"").replace(/usd$/,"").match(/^(\d+(?:\.\d+)?)(k|thousand|m|mm|mil|million|b|bn|billion)?$/);
  if(!m)return null;const n=parseFloat(m[1]),u=m[2]||"";
  return Math.round(n*(/^k|^thousand/.test(u)?1e3:/^b/.test(u)?1e9:/^m/.test(u)?1e6:1));
}
function moneyShort(n){if(n===null||n===undefined||n==="")return"";n=+n;return n>=1e9?"$"+(+(n/1e9).toFixed(2))+"B":n>=1e6?"$"+(+(n/1e6).toFixed(1))+"M":n>=1e3?"$"+Math.round(n/1e3)+"K":"$"+n}
function revOf(b){return parseMoney(b.revenue)}
function revRange(){const s=settings();return{min:s.revMin??null,max:s.revMax??null,unknown:s.revUnknown!==false}}
function revActive(){const r=revRange();return r.min!==null||r.max!==null}
function inRev(b){return revOK(b)&&(b.sample||!tgOnly()||inTarget(b))}
function revOK(b){const r=revRange();if(r.min===null&&r.max===null)return true;const v=revOf(b);if(v===null)return r.unknown;return(r.min===null||v>=r.min)&&(r.max===null||v<=r.max)}

function targeting(){const M=memo();if(M.tg)return M.tg;const t=byId("settings","targeting")||{};return M.tg={...TG_DEFAULT,...t,gens:{...TG_DEFAULT.gens,...(t.gens||{})}}}

function empOf(b){const v=b.employees??(b.profile||{}).employees;const m=String(v??"").match(/\d[\d,]*/);return m?+m[0].replace(/,/g,""):null}
function parseStates(v){return[...new Set(String(v||"").split(/[,;\s]+/).map(stateCode).filter(Boolean))]}
function targetFit(b){
  const M=memo();M.tf=M.tf||{};if(M.tf[b.id])return M.tf[b.id];
  const t=targeting(),why=[],st=b.state||"",ind=b.industry||"Other";let pts=0,out=false;
  if(st&&t.focusStates.includes(st)){pts+=6;why.push("In a focus state ("+st+")")}

  if(t.excludeIndustries.includes(ind)){out=true;why.push(shortInd(ind)+" is an excluded industry")}
  else if(t.industries.includes(ind)){pts+=6;why.push(shortInd(ind)+" is a target industry")}
  const e=empOf(b);
  if(e!==null){if(e>=(+t.empMin||0)&&(!+t.empMax||e<=+t.empMax)){pts+=3;why.push(e+" employees, in your range")}else{pts-=4;why.push(e+" employees, outside "+t.empMin+"–"+t.empMax)}}

/* ---------- Industry climate: the economy decides which industries rank first ---------- */
function climateMode(){return settings().climateFocus||"growth"}
function climateOf(ind){
  const M=memo();M.clim=M.clim||{};if(M.clim[ind])return M.clim[ind];
  let sc=0;const up=[],down=[];
  for(const n of S.news){if(!newsActive(n)||!n.outlook)continue;let v=0;
    for(const [k,x] of Object.entries(n.outlook))if(k===ind||k==="all"||(k==="Healthcare (all)"&&ind.startsWith("Healthcare")))v+=x;
    if(v){sc+=v;(v>0?up:down).push({n,v})}}
  sc=Math.max(-4,Math.min(4,sc));
  const label=sc>=3?"Strong tailwind":sc>=1?"Tailwind":sc<=-3?"Strong headwind":sc<=-1?"Headwind":"Neutral";
  return M.clim[ind]={score:sc,label,up,down};
}
function climatePts(b){const m=climateMode();if(m==="off"||settings().newsOff)return 0;const c=climateOf(b.industry||"Other").score;return m==="both"?Math.abs(c)*2:c*3}
function climateTag(ind){const c=climateOf(ind||"Other");if(!c.score||climateMode()==="off")return"";return`<span class="tag ${c.score>0?"b":"s"}">${c.score>0?"▲":"▼"} ${esc(c.label)}</span>`}

  return`<h2>Industry climate</h2><p class="lede">Which industries today's economy favors, built from the jobs report, the factory and services surveys, and industry news, each with its source. Businesses in favored industries rank higher on Today, Signals, Businesses, Pipeline and the research queue.</p>

  <p class="hint">${m==="growth"?"Tailwind industries gain up to 12 points of Opportunity Score; headwind industries lose up to 12.":m==="both"?"Any strong climate, good or bad, adds up to 8 points: struggling industries need CFOs, restructuring and M&A advice too.":"Climate is shown but doesn't change scores."} This only applies to businesses that already have signals. ${newsAge()!==null?`Data last updated ${newsAge()} day${newsAge()===1?"":"s"} ago. `:""}Say <b>"Update my news"</b> in chat to refresh it.</p>

    ${[...r.up,...r.down].slice(0,4).map(x=>`<div class="meta">${x.v>0?"▲":"▼"} ${x.n.url?`<a href="${esc(x.n.url)}" target="_blank" rel="noopener">${esc(x.n.title)}</a>`:esc(x.n.title)}</div>`).join("")}

function addDays(day,n){const d=new Date(day+"T12:00:00");d.setDate(d.getDate()+n);return localDay(d.toISOString())}
function agendaFor(day){
  const today=localDay(), real=S.biz.filter(b=>!b.sample);
  const calls=S.outreach.filter(o=>o.apptAt===day&&!(byId("biz",o.bizId)||{}).sample).map(o=>({kind:"call",b:byId("biz",o.bizId),o,time:o.apptTime||"",key:"0"+(o.apptTime||"99")}));
  const fus=real.filter(b=>b.followUpAt&&isOpenStage(b)&&(day===today?b.followUpAt<=day:b.followUpAt===day)).map(b=>({kind:b.followUpAt<today?"over":"fu",b,key:(b.followUpAt<today?"1":"2")+b.followUpAt}));

function genBot(id,name,rule,when,what){return{id,name,kind:"cloud",gen:true,rule,when,what:what+" Follows your Targeting.",
  seen:()=>latest(genFound(id).map(b=>b.createdAt)),

function draftsReady(){return S.drafts.filter(d=>d.status!=="sent"&&d.status!=="dismissed"&&byId("biz",d.bizId))}
function watchList(){const real=S.biz.filter(b=>!b.sample&&inRev(b));const f=real.filter(b=>b.followed);const top=real.filter(b=>!b.followed).sort((a,b)=>opportunity(b).score-opportunity(a).score).slice(0,Math.max(0,15-f.length));return[...f,...top]}
function stuckBridges(){return S.match.filter(m=>["Approved","Introduced","Meeting"].includes(m.status)&&daysSince(m.updatedAt||m.createdAt)>=7)}
function coverageGaps(){const M=memo();if(M.gaps)return M.gaps;const g={};
  for(const b of S.biz.filter(x=>!x.sample&&inRev(x))){if(bridgesFor(b).length)continue;const n=needsFor(b)[0];if(!n)continue;const k=n.profs[0]+"|"+(b.state||"?");(g[k]=g[k]||{prof:PROF_NOUN[n.profs[0]]?PROF_NOUN[n.profs[0]].replace(/^./,c=>c.toUpperCase()):n.profs[0],state:b.state||"unknown state",n:0}).n++}

/* search */
const SYN={dentist:"dental",dentists:"dental",doctor:"medical",doctors:"medical",physician:"medical",lawyer:"attorney",lawyers:"attorney",accountant:"cpa",accountants:"cpa",accounting:"cpa",bank:"banker",banks:"banker",bankers:"banker",
  loan:"lend",loans:"lend",lender:"lend",lenders:"lend",insurer:"insurance",broker:"broker",brokers:"broker",restaurant:"food",restaurants:"food",factory:"manufacturing",manufacturer:"manufacturing",
  builder:"construction",contractor:"construction",contractors:"construction",trucking:"logistics",pt:"therapy",retire:"succession",retiring:"succession",retirement:"retire",exit:"succession",sell:"succession",selling:"succession",it:"tech"};
const STOP=new Set(["the","a","an","in","of","for","and","to","with","near","me","my","show","find","all","that","who","are","is","businesses","business","specialists","specialist","companies","company"]);
function bTokens(s){return String(s||"").toLowerCase().replace(/[^a-z0-9&$.\s-]/g," ").split(/\s+/).filter(t=>t&&!STOP.has(t))}
function hayBiz(b){const M=memo();M.hb=M.hb||{};if(M.hb[b.id])return M.hb[b.id];const o=opportunity(b);
  return M.hb[b.id]=[b.name,b.industry,b.city,b.county,b.state,b.contact,b.trigger,b.notes,stageOf(b),...needsFor(b).map(n=>n.label),...o.active.map(s=>(SIGNAL_TYPES[s.type]||SIGNAL_TYPES.other).l+" "+(s.evidence||"")),...(b.contacts||[]).map(c=>c.name+" "+(c.role||""))].join(" ").toLowerCase()}
function hayCoi(c){return[c.name,c.firm,c.profession,c.specialties,c.county,c.state,c.serviceArea,c.bestStage,c.languages,c.healthcare?"healthcare medical dental":"",c.notes].join(" ").toLowerCase()}
function hit(h,toks){return toks.every(t=>h.includes(t)||(SYN[t]&&h.includes(SYN[t]))||(t.length>3&&t.endsWith("s")&&h.includes(t.slice(0,-1))))}
const isQuestion=s=>/\?\s*$/.test(s)||/^(who|what|which|how|why|where|when|should|can|could|is|are|do|does|list|summarize|compare|tell|give)\b/i.test(s.trim());
function brainResults(){
  const raw=BR.q.trim(),toks=bTokens(raw);if(!toks.length)return null;
  const biz=S.biz.filter(b=>inRev(b)&&hit(hayBiz(b),toks)).map(b=>({b,s:opportunity(b).score})).sort((x,y)=>(x.b.sample?1:0)-(y.b.sample?1:0)||y.s-x.s);
  const coi=S.coi.filter(c=>hit(hayCoi(c),toks));
  const sig=[];for(const b of S.biz.filter(inRev)){for(const s of opportunity(b).active){if(hit([(SIGNAL_TYPES[s.type]||SIGNAL_TYPES.other).l,s.evidence,b.name,b.industry,b.state,s.providerName].join(" ").toLowerCase(),toks))sig.push({s,b})}}
  sig.sort((a,b)=>sigAge(a.s)-sigAge(b.s));
  const news=S.news.filter(n=>newsActive(n)&&hit([n.title,n.summary,n.impact,(n.industries||[]).join(" "),(n.states||[]).join(" ")].join(" ").toLowerCase(),toks)).sort((a,b)=>(b.publishedAt||"").localeCompare(a.publishedAt||""));
  return{biz,coi,sig,news,total:biz.length+coi.length+sig.length+news.length}
}
function rGroup(key,title,items,row,lim){if(!items.length)return"";const all=BR.more[key],show=all?items:items.slice(0,lim||4);
  return`<div class="rgroup"><div class="shead"><h3>${title} <span class="cnt">${items.length}</span></h3>${items.length>(lim||4)?`<button class="link" data-brmore="${key}">${all?"Show less":"Show all"}</button>`:""}</div><div class="card rlist">${show.map(row).join("")}</div></div>`}
function askBox(prompt){
  const last=AQ.turns.length>=2?AQ.turns.slice(-2):null, off=SAMPLE===null;
  if(off)return`<div class="askcard"><div class="meta">Asking questions needs Referral Bridge open inside Claude.</div></div>`;
  return`<div class="askcard">${!last||AQ.busy||last[0].content!==BR.q.trim()?`<button class="btn primary askgo" data-brainask="1" ${AQ.busy?"disabled":""}><span aria-hidden="true">✦</span> ${AQ.busy?"Thinking…":prompt?`Ask the Brain`:"Ask the Brain about this"}</button>`:""}
   ${AQ.err?`<div class="err">${esc(AQ.err)}</div>`:""}

     <div class="row" style="margin-top:6px">${AQ.busy?`<button class="btn small" data-askstop="1">Stop</button>`:`<button class="btn small ghost" data-askclear="1">Clear answer</button>`}</div></div>`:""}
   <div class="hint" style="margin:6px 0 0">Answers come only from your stored businesses, specialists, signals and news.</div></div>`}
function brainBody(){
  const R=brainResults();
  if(!R)return brainHome();
  const q=BR.q.trim(),question=isQuestion(q);
  let h=question?askBox(true):"";
  if(!R.total&&!question)h+=`<div class="empty"><p>Nothing stored matches "${esc(q)}".</p></div>`+askBox(false);
  h+=rGroup("biz","Businesses",R.biz,({b,s})=>`<button class="rrow" data-bizview="${b.id}"><span class="rmain"><b>${esc(b.name)}</b><span class="meta">${esc(shortInd(b.industry))} · ${esc(placeOf(b)||"—")}${bridgesFor(b).length?' · <span class="okc">Bridge ready</span>':""}</span></span><span class="score sm">${s}</span></button>`);
  h+=rGroup("coi","Specialists",R.coi,c=>`<button class="rrow" data-coi="${c.id}"><span class="rmain"><b>${esc(c.name)}</b><span class="meta">${esc(c.profession||"")}${c.firm?" · "+esc(c.firm):""} · ${esc(c.serviceArea||c.state||"")}</span></span><span class="chev" aria-hidden="true">›</span></button>`);
  h+=rGroup("sig","Signals",R.sig,({s,b})=>`<button class="rrow" data-bizview="${b.id}"><span class="rmain"><b>${esc((SIGNAL_TYPES[s.type]||SIGNAL_TYPES.other).l)}</b><span class="meta">${esc(b.name)} · ${esc(ageLabel(sigAge(s)))}</span></span><span class="chev" aria-hidden="true">›</span></button>`);
  h+=rGroup("news","News",R.news,n=>`<a class="rrow" href="${esc(n.url||"#")}" target="_blank" rel="noopener"><span class="rmain"><b>${esc(n.title)}</b><span class="meta">${esc(n.sourceName||"")} · ${esc(fmtDate(n.publishedAt))}</span></span><span class="chev" aria-hidden="true">↗</span></a>`,3);
  if(R.total&&!question)h+=askBox(false);
  return h;
}

/* ---------- Research queue: every real lead gets a full profile, best first ---------- */
const RESEARCH_TTL=180;  /* days before a profile is due for a refresh */
function researchState(b){
  if(b.sample)return"sample";if(b.researchStatus==="skip")return"skip";
  const t=Date.parse(b.researchedAt||"");if(!isNaN(t)&&Date.now()-t<RESEARCH_TTL*DAY)return"done";
  if(settings().autoResearch===false&&!S.creq.some(r=>r.bizId===b.id&&r.status==="Waiting"))return"off";

  const E=S.match.filter(m=>m.status!=="Dismissed").map(m=>{const b=byId("biz",m.bizId),c=byId("coi",m.coiId);return b&&c?{b,c,sc:score(b,c).score,st:m.status,id:m.id}:null}).filter(Boolean);

  const fo=f?(byId("biz",f)||byId("coi",f)):null, fk=f&&byId("biz",f)?"biz":"coi";

  h+=fo?`<div class="netfocus"><span>Showing bridges for <b>${esc(fo.name)}</b></span><span class="row" style="flex:none"><button class="btn ghost" data-${fk==="biz"?"bizview":"coi"}="${fo.id}">Open</button><button class="btn" data-nclear="1">Show all</button></span></div>`

function findResults(){
  if(!S.coi.length)return`<div class="empty"><p>No advisors to search yet.</p><button class="btn primary" data-go="coi">Add advisors</button></div>`;
  const b=F.bizId?byId("biz",F.bizId):null;
  const tokens=F.text.toLowerCase().split(/[\s,]+/).filter(t=>t.length>1);
  const county=(F.county||(b&&b.county)||"").trim().toLowerCase();
  const out=[];
  for(const c of S.coi){
    if(F.need&&c.profession!==F.need)continue;
    if(F.hc&&!c.healthcare)continue;
    const strong=[c.profession,c.specialties].join(" ").toLowerCase();
    const weak=[c.name,c.firm,c.notes,c.county,c.serviceArea].join(" ").toLowerCase();
    let s,why=[],ok=true,hits=[];
    for(const t of tokens){if(strong.includes(t))hits.push([t,10]);else if(weak.includes(t))hits.push([t,5]);else{ok=false;break}}
    if(!ok)continue;
    if(b){const r=score(b,c);if(!r.score&&!F.need&&!tokens.length)continue;s=r.score;why=r.why.slice()}
    else{
      s=40;
      if(county){const home=(c.county||"").trim().toLowerCase(),area=String(c.serviceArea||"").toLowerCase().split(",").map(x=>x.trim());
        if(home===county){s+=15;why.push(`Based in ${c.county} County`)}else if(area.includes(county)){s+=10;why.push(`Serves ${F.county} County`)}else{s-=10}}
      if(c.healthcare)why.push("Healthcare specialist");
      const won=S.match.filter(m=>m.coiId===c.id&&m.status==="Closed").length;
      if(won){s+=Math.min(15,won*3);why.push(`${won} closed referral${won>1?"s":""}`)}
    }
    if(hits.length){s+=hits.reduce((a,h)=>a+h[1],0);why.unshift("Matches "+hits.map(h=>`"${h[0]}"`).join(", "))}
    out.push({c,s:Math.max(0,Math.min(100,s)),why});
  }
  out.sort((x,y)=>y.s-x.s);
  if(!out.length)return`<div class="empty"><p>No advisors match these filters. Remove a filter or try a broader word.</p></div>`;
  const taken=new Set(S.match.map(m=>m.bizId+":"+m.coiId));
  return `<p class="count">${out.length} advisor${out.length>1?"s":""}${b?` ranked for ${esc(b.name)}`:""}</p><div class="list">${out.map(({c,s,why})=>{
    const specs=String(c.specialties||"").split(",").map(x=>x.trim()).filter(Boolean);
    const matched=b&&taken.has(b.id+":"+c.id);
    return `<div class="result"><div class="top-line"><div><div class="name">${esc(c.name)}</div><div class="meta">${esc([c.firm,c.county&&c.county+" County"].filter(Boolean).join(", "))}</div></div><span class="fit" title="Fit score">${s}</span></div>

function parseCSV(text){
  const rows=[];let row=[],cell="",inQ=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(inQ){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else inQ=false}else cell+=ch}
    else if(ch==='"')inQ=true;else if(ch===","){row.push(cell);cell=""}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text[i+1]==="\n")i++;row.push(cell);rows.push(row);row=[];cell=""}
    else cell+=ch}
  if(cell||row.length){row.push(cell);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()));
}
function naicsIndustry(c){

  const r=[[/^62121/,"Healthcare - dental"],[/^62134|^62139|^6213[2]/,"Healthcare - therapy and rehab"],[/^62133|^62142|^62322/,"Healthcare - behavioral health"],[/^6216|^6231|^6233|^62412/,"Healthcare - home health and senior care"],
    [/^44611|^456110/,"Healthcare - pharmacy"],[/^54194/,"Veterinary"],[/^62[1-3]/,"Healthcare - medical"],[/^6244|^611/,"Education and childcare"],[/^624/,"Nonprofit"],
    [/^11/,"Agriculture"],[/^21|^22/,"Energy and utilities"],[/^23/,"Construction"],[/^3[1-3]/,"Manufacturing"],[/^42/,"Wholesale and distribution"],[/^4[45]/,"Retail"],[/^4[89]/,"Transportation and logistics"],
    [/^511|^518|^519|^5415/,"Technology and software"],[/^51/,"Arts and recreation"],[/^52/,"Finance and insurance"],[/^53/,"Real estate or holding"],[/^54|^55|^561/,"Professional services"],[/^562/,"Environmental and waste services"],
    [/^71/,"Arts and recreation"],[/^721/,"Hospitality and lodging"],[/^722/,"Food service"],[/^8111/,"Auto services"],[/^812/,"Personal services"],[/^813/,"Nonprofit"]];
  for(const [re,v] of r)if(re.test(c))return v;
  return"Other";
}
function guessIndustry(name,tax){

  if(/^251|^311|^313/.test(t)||/home health|home care|hospice|senior living|assisted living|nursing home/.test(n))return"Healthcare - home health and senior care";

  if(/restaurant|cafe|café|pizza|grill|bakery|deli|kitchen|catering|bistro|bar\b|brew|taco|burger|sushi/.test(n))return"Food service";

  if(/software|technolog|\btech\b|labs\b|digital|\bai\b|data|cloud|cyber/.test(n))return"Technology and software";

async function importCSV(file){
  const rows=parseCSV(await file.text());
  if(rows.length<2){toast("That file has no rows to import");return}
  const head=rows[0].map(h=>h.trim().toLowerCase());
  const col=(...names)=>{for(const n of names){const i=head.indexOf(n);if(i>=0)return i}for(const n of names){const i=head.findIndex(h=>h.includes(n));if(i>=0)return i}return-1};
  const iName=col("current_entity_name","entity_name","provider organization name (legal business name)","business name","name");
  if(iName<0){toast("Couldn't find a business name column");return}
  const iDate=col("initial_dos_filing_date","date_registration","registration_date","formation_date","filing_date","initial_filing_date","provider enumeration date","enumeration date","date");
  const iEmail=col("business_email_address","email"), iCity=col("billingcity","city"), iNaics=col("naics_code","naics");
  const iCounty=col("county"), iState=col("provider business practice location address state name","billingstate","state");
  const iRev=col("annual_revenue","revenue","annual sales","sales_volume","sales");
  const iType=col("entity_type"), iTax=col("healthcare provider taxonomy code_1","taxonomy");
  const isNPI=head.some(h=>h.includes("npi"));
  const isCT=head.some(h=>h.includes("business_email_address")||h==="billingcity");
  const norm=n=>String(n||"").toLowerCase().replace(/&/g," and ").replace(/[^a-z0-9 ]/g," ").replace(/\b(the|llc|pllc|pc|p c|inc|incorporated|corp|corporation|co|company|ltd|lp|llp|dds|dmd|md)\b/g," ").replace(/\s+/g," ").trim();
  const byNorm={};for(const b of S.biz){const k=norm(b.name);(byNorm[k]=byNorm[k]||[]).push(b)}
  const seen=new Set(S.biz.map(b=>norm(b.name)+"|"+(b.state||"")));
  const toAdd=[];
  for(const r of rows.slice(1)){
    const name=(r[iName]||"").trim(); if(!name)continue;
    const rawDate=iDate>=0?(r[iDate]||"").trim():""; const t=Date.parse(rawDate);
    const type=iType>=0?(r[iType]||"").toUpperCase():"";
    const entity=/PLLC|PROFESSIONAL SERVICE LIMITED/.test(type+name.toUpperCase())?"PLLC":/\bP\.?C\.?\b|PROFESSIONAL CORP/.test(type+name.toUpperCase())?"PC":/LLC|LIMITED LIABILITY/.test(type+name.toUpperCase())?"LLC":/CORP|INC/.test(type+name.toUpperCase())?"Corporation":"";
    const rawSt=iState>=0?(r[iState]||"").trim().toUpperCase():"";
    const st=stateCode(rawSt)||(isCT?"CT":"")||LS.state||"NY";
    const nk=norm(name); if(seen.has(nk+"|"+st))continue; seen.add(nk+"|"+st);  /* same normalized name in the same state = same business */
    const dup=(byNorm[nk]||[]).find(x=>x.state!==st);                         /* same name elsewhere: import, flag for review, never merge */
    const naics=iNaics>=0?(r[iNaics]||"").trim():"";
    const industry=naicsIndustry(naics)||guessIndustry(name,iTax>=0?r[iTax]:"");
    const rv=iRev>=0?parseMoney(r[iRev]):null;
    toAdd.push({id:uid(),name,industry,naics,...(rv!==null?{revenue:rv,revenueSource:"CSV import",revenueAsOf:new Date().toISOString()}:{}),entityType:entity,email:iEmail>=0?(r[iEmail]||"").trim():"",city:iCity>=0?(r[iCity]||"").trim():"",lead:true,
      county:iCounty>=0?(r[iCounty]||"").trim().replace(/\s+county$/i,"").replace(/\b\w/g,s=>s.toUpperCase()).replace(/\B\w+/g,s=>s.toLowerCase()):"",
      state:st,formedDate:isNaN(t)?"":new Date(t).toISOString().slice(0,10),
      trigger:isNPI?"New license or NPI":"New formation",possibleDupOf:dup?dup.id:"",source:isNPI?"NPI registry":st==="CT"?"CT registry":st==="PA"?"PA registry":st==="NJ"?"NJ filing":st==="NY"?"NY DOS filing":"State filing"});
    if(toAdd.length>=200)break;
  }
  if(!toAdd.length){toast("Everything in that file is already in your list");return}
  toast(`Importing ${toAdd.length} businesses…`);
  let ok=toAdd.length,failed=0;
  if(db){ok=0;for(let i=0;i<toAdd.length;i++){if(await put("biz",toAdd[i]))ok++;else failed++;if(i%20===19)toast(`Imported ${ok} of ${toAdd.length}`)}}
  else{const now=new Date().toISOString();toAdd.forEach(b=>{b.createdAt=b.updatedAt=now;S.biz.push(b)});saveLocal();render()}
  toast(failed?`Imported ${ok} of ${toAdd.length} businesses. ${failed} couldn't be saved; import the file again to retry them.`:`Imported ${ok} businesses`);
}

    case"pblist":PB.list=!PB.list;render();break;
    case"newMatch":newMatchSheet();break;
    case"createMatch":{const b=$("#f_mb").value,c=$("#f_mc").value;
      if(S.match.some(m=>m.bizId===b&&m.coiId===c)){$("#err_pair").textContent="This pair is already matched. Open it from the pipeline.";return}
      const sc=score(byId("biz",b),byId("coi",c)).score;closeSheet();if(await approve(b,c,sc)){stage="Approved";toast("Match added")}if(db)render();break}
    case"clearSample":{if(t.dataset.confirm!=="1"){t.dataset.confirm="1";t.textContent="Tap again to remove";return}
      const sb=new Set(S.biz.filter(x=>x.sample).map(x=>x.id));
      const all=[...S.signal.filter(s=>sb.has(s.businessId)).map(s=>["signal",s.id]),...["match","biz","coi"].flatMap(k=>S[k].filter(x=>x.sample).map(x=>[k,x.id]))];
      const failed=await delMany(all);stage=null;toast(failed?`Removed ${all.length-failed} of ${all.length} sample records. ${failed} couldn't be removed; tap again to retry.`:"Sample records removed");if(db)render();break}
  }
});
document.addEventListener("toggle",e=>{const el=e.target;if(el&&el.matches&&el.matches("details[data-sec]")){BV.open=BV.open||{};BV.open[el.dataset.sec]=el.open}},true);
$("#sheet").addEventListener("click",e=>{if(e.target===$("#sheet"))closeSheet()});
function netAct(el){
  if(el.dataset.nfocus){const id=el.dataset.nfocus;NET.focus=NET.focus===id?null:id;render();return}
  if(el.dataset.nedge){const v=el.dataset.nedge;if(v.startsWith("m:")){const m=byId("match",v.slice(2));if(m)matchSheet(m)}else{const [b,c,sc]=v.slice(2).split("|");suggestSheet(b,c,sc)}}
}
document.addEventListener("click",e=>{const el=e.target.closest&&e.target.closest("[data-nfocus],[data-nedge]");if(el)netAct(el)});
document.addEventListener("keydown",e=>{if(e.key!=="Enter"&&e.key!==" ")return;const el=e.target.closest&&e.target.closest("[data-nfocus],[data-nedge]");if(el){e.preventDefault();netAct(el)}});
$("#sheet").addEventListener("input",e=>{
  if(e.target.id==="qzcounty"){QZ.county=e.target.value.trim();document.querySelectorAll("[data-qzset^='county|']").forEach(x=>x.setAttribute("aria-pressed","false"));const n=$("[data-qz='next']");if(n)n.textContent=QZ.county?"Next":"Skip"}
  if(e.target.id==="qzname"){QZ.name=e.target.value;QZ.err="";const er=$("#qzerr");if(er)er.textContent=""}
});
$("#sheet").addEventListener("change",e=>{
  if(e.target.id==="qzbiz"){const id=e.target.value;if(id){quizStart(id);QZ.step=0;quizRender()}else{QZ.bizId="";quizRender()}}
  if(e.target.dataset&&e.target.dataset.qzpick){const id=e.target.dataset.qzpick;if(e.target.checked)QZ.picks.add(id);else QZ.picks.delete(id)}
});

render();
connect();
</script>
